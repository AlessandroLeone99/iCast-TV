name: iCast TV - Fire OS test APK

on:
  push:
    branches:
      - 'icast/fireos-test'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icast-fireos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel_superseded:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel previous multi-ABI runs
        if: github.ref == 'refs/heads/icast/fireos-test'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          for id in 45595455573 45595928813; do
            status=$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status)
            if [ "$status" != completed ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" || echo "::warning::Cancellation request for $id was rejected; check Actions."
            fi
          done
  build:
    needs: cancel_superseded
    if: always() && !cancelled()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Build test APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify APK contains ARM32 only
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as apk:
              abis = {p.split('/')[1] for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')}
          print('Native ABIs:', sorted(abis))
          assert abis == {'armeabi-v7a'}, abis
          PY
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCast-TV-FireOS-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish diagnostic prerelease
        if: github.ref == 'refs/heads/icast/fireos-test'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk iCast-TV.apk
          gh release create "v$version" iCast-TV.apk --target "$GITHUB_SHA" --prerelease --title "iCast TV $version (experimental)" --notes "ARM32-only experimental debug build with AirPlay diagnostics and subtitle rendering (CC). Not device-tested. See ICAST-TEST.md. Existing debug installs may need uninstalling if signing keys differ."
